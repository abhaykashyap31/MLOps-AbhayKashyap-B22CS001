# ═══════════════════════════════════════════════════════════════════════
# DATA CONTRACT: CityMove Ride Events
#
# NEGOTIATION SUMMARY
# Producer: CityMove Data Engineering Team
# Consumer: Dynamic Pricing ML Team
#
# Agreed Terms:
# - Logical field names provided as a stable interface
# - fare must never be negative (hard circuit breaker)
# - driver rating constrained to 1.0–5.0 inclusive
# - passenger ID flagged as PII
# - Data freshness required within 30 minutes of ride completion
# - Any critical rule violation blocks downstream ML consumption
# ═══════════════════════════════════════════════════════════════════════

dataContractSpecification: 0.9.3
id: urn:datacontract:citymove:rides
version: 1.0.0

info:
  title: "CityMove Ride Events"
  description: |
    Canonical ride-level dataset consumed by pricing and analytics models.
    Acts as a stable interface over the operational rides database.
  owner: "CityMove Data Engineering"
  classification: confidential
  tags: [rides, pricing, ml, pii]

schema:
  type: object
  properties:

    ride_id:
      type: string
      description: "Unique identifier for a ride"
      pii: false
      physical_mapping: r_id

    pickup_timestamp:
      type: string
      format: date-time
      description: "UTC timestamp when the ride started"
      pii: false
      physical_mapping: ts_start

    passenger_id:
      type: integer
      description: "Unique passenger identifier (PII)"
      pii: true
      physical_mapping: pax_id

    driver_rating:
      type: number
      description: "Driver rating from passenger (1.0–5.0)"
      minimum: 1.0
      maximum: 5.0
      pii: false
      physical_mapping: d_rating

    fare_usd:
      type: number
      description: "Total final fare charged in USD"
      minimum: 0
      pii: false
      physical_mapping: fare_final

    distance_meters:
      type: integer
      description: "Distance traveled during ride in meters"
      pii: false
      physical_mapping: dist_m

  required:
    - ride_id
    - pickup_timestamp
    - passenger_id
    - driver_rating
    - fare_usd
    - distance_meters

sla:
  freshness:
    threshold: "30 minutes"
    description: "Maximum delay from ride completion to availability"
  availability:
    percentage: "99.9%"

quality:
  - name: fare_non_negative
    type: validity
    expression: "fare_usd >= 0"
    threshold: "100%"
    enforcement: hard

  - name: driver_rating_range
    type: validity
    expression: "driver_rating >= 1.0 AND driver_rating <= 5.0"
    threshold: "100%"
    enforcement: hard

  - name: distance_not_null
    type: completeness
    column: distance_meters
    threshold: "100%"
    enforcement: hard
