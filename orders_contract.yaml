dataContractSpecification: 0.9.3
id: urn:datacontract:ecommerce:orders
version: 1.0.0

info:
  title: "E-commerce Orders Stream"
  description: "Real-time order feed for marketing dashboards"
  owner: "Commerce Data Platform"
  classification: internal
  tags: [orders, ecommerce, realtime]

schema:
  type: object
  properties:

    order_total_usd:
      type: number
      description: "Total order value in USD"
      minimum: 0
      physical_mapping: o_total

    status:
      type: string
      enum: [PAID, SHIPPED, CANCELLED]
      description: |
        Order status mapped from codes:
        2=PAID, 5=SHIPPED, 9=CANCELLED
      physical_mapping: status_code

  required:
    - order_total_usd
    - status

quality:
  - name: order_total_non_negative
    type: validity
    expression: "order_total_usd >= 0"
    threshold: "100%"
    enforcement: hard

  - name: valid_status_code
    type: validity
    expression: "status IN ('PAID', 'SHIPPED', 'CANCELLED')"
    threshold: "100%"
    enforcement: hard
